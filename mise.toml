[tools]
rust = "1.84"

[env]
RUST_BACKTRACE = "1"

[tasks]
build = "cargo build --workspace"
test = "cargo test --workspace"
fmt = "cargo fmt --all"
clippy = "cargo clippy --workspace -- -D warnings"

[tasks.headers]
description = "Apply license headers to all source files"
run = "cargo run --package forehead-cli -- apply"

[tasks.ci]
description = "Run all CI checks"
depends = ["fmt", "headers", "clippy", "test", "build"]

[tasks.changelogger]
description = "Install changelogger-cli v0.2.2"
run = "cargo install changelogger-cli --version 0.2.2"
