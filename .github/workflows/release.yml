name: Release

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "value=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check if version changed
      id: changed
      run: |
        git show HEAD~1:Cargo.toml 2>/dev/null | grep -q "version = \"${{ steps.version.outputs.version }}\"" && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Check if release exists
      id: release
      run: |
        git fetch --tags --force
        if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust
      if: steps.changed.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Publish forehead-core
      if: steps.changed.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
      run: cargo publish -p forehead-core
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Publish forehead-cli
      if: steps.changed.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
      run: cargo publish -p forehead-cli
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Create release
      if: steps.changed.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --title "v${{ steps.version.outputs.version }}" \
          --generate-notes