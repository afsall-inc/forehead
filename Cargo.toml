[workspace]
resolver = "2"

members = [
    "packages/forehead-core",
    "packages/forehead-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Afsall Inc"]
repository = "https://github.com/afsall-inc/forehead"
description = "A tool for creating and maintaining file headers for code license"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.5"
rayon = "1.10"